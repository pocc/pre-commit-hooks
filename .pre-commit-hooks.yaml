---
# This file tells https://pre-commit.com/
# which hooks are provided by this repo
# for use by other git repos.

- id: clang-format
  name: clang-format
  entry: clang-format-hook
  description: Formats C, C++, Objective-C, and Java code
  types_or: [c, c++, c#, objective-c, java]
  language: python
- id: clang-tidy
  name: clang-tidy
  entry: clang-tidy-hook
  description: Find warnings/errors in C, C++, and Objective-C code
  types_or: [c, c++, c#, objective-c]
  language: python
- id: oclint
  name: oclint
  entry: oclint-hook
  description: Find warnings/errors in C, C++, and Objective-C code
  types_or: [c, c++, c#, objective-c]
  language: python
- id: uncrustify
  name: uncrustify
  entry: uncrustify-hook
  description: Formats C, C++, C#, Objective-C, and Java code
  # identify has no `d` tag. `vala` exists only in identify>=2.6.21, and an unknown tag makes
  # pre-commit reject this whole manifest, so Vala is a separate hook (uncrustify-vala) for now.
  types_or: [c, c++, c#, objective-c, java]
  language: python
- id: uncrustify-vala
  name: uncrustify (vala)
  entry: uncrustify-hook
  description: Formats Vala code
  # Matched by extension rather than `types_or: [vala]` so it works with any identify version.
  # See https://github.com/pocc/pre-commit-hooks/issues/87
  types: [text]
  files: (?i)\.vala$
  language: python
- id: cppcheck
  name: cppcheck
  entry: cppcheck-hook
  description: Find warnings/errors in C, C++, and Objective-C code
  types_or: [c, c++, c#, objective-c]
  language: python
  require_serial: true
- id: cpplint
  name: cpplint
  entry: cpplint-hook
  description: Find warnings/errors in C/CPP code
  types_or:  [c, c++, c#, objective-c, cuda]
  language: python
- id: include-what-you-use
  name: include-what-you-use
  entry: include-what-you-use-hook
  description: Runs Include-What-You-Use (iwyu) in C/CPP code
  types_or:  [c, c++, c#, objective-c, cuda]
  language: python
